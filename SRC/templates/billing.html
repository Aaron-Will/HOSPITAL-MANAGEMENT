{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h2><i class="fas fa-dollar-sign"></i> Billing Management</h2>
            <hr>
        </div>
    </div>
    
    <div class="row">
        <div class="col-md-6">
            <div class="card shadow mb-4">
                <div class="card-header bg-danger text-white">
                    <h5><i class="fas fa-file-invoice"></i> Create New Bill</h5>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('create_bill') }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Patient ID</label>
                            <input type="number" class="form-control" name="patient_id" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Appointment ID</label>
                            <input type="number" class="form-control" name="appointment_id" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Amount ($)</label>
                            <input type="number" step="0.01" class="form-control" name="total_amount" required>
                        </div>
                        <button type="submit" class="btn btn-danger w-100">Create Bill</button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="
